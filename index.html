<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#262626">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Backup Mitra Kasir</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js" onerror="void 0"></script>
<style>
:root{--bg:#262626;--side:#171717;--card:#1c1c1c;--card2:#272727;--bd:#333;--tx:#ffffff;--mu:#a1a1a1;--ac:#f5f5f5;--ok:#4ade80;--dg:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card2);border-radius:12px;min-height:42px;padding:0 16px;font-weight:600}
button:active{opacity:.75}
button.p{background:var(--ac);border-color:var(--ac);color:#1a1a1a}
button:disabled{opacity:.4;cursor:default}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px 13px}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:12px 0 5px}
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{width:230px;flex:none;background:var(--side);border-right:1px solid var(--bd);padding:22px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.logo{font-size:24px;font-weight:700;padding:0 12px 10px;letter-spacing:-.01em}
.nv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;min-height:44px;border-radius:10px;padding:0 12px;color:#f0f0f0;font-weight:500}
.nv svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nv.on{background:var(--card2);color:#fff;font-weight:500}
.gl{font-size:14px;color:var(--mu);padding:14px 12px 6px}
.sx{display:none}
.sf{margin-top:auto;display:flex;align-items:center;gap:12px;padding:10px 8px;color:#fff;font-weight:500}
.sf i{width:36px;height:36px;border-radius:9px;background:#525252;display:grid;place-items:center;font-style:normal;font-weight:600}
.main{flex:1;min-width:0;padding:16px}
.mh{display:none;align-items:center;gap:12px;margin-bottom:12px}
.mh button{width:42px;padding:0;font-size:18px}
.mh b{font-size:18px}
h1{margin:0 0 14px;font-size:24px}
.v{display:none}.v.on{display:block}
.pos{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tab{flex:none;border-radius:99px;min-height:38px;padding:0 16px;color:var(--mu)}
.tab.on{background:var(--ac);border-color:var(--ac);color:#1a1a1a}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
.it{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd)}
.it:last-child{border-bottom:0}
.it .n{flex:1;min-width:0;font-weight:600}.it .n small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.pr{color:var(--ac);font-weight:700;white-space:nowrap}
.add{width:42px;height:42px;padding:0;font-size:22px;border-radius:50%;background:var(--ac);border-color:var(--ac);color:#1a1a1a}
.cart h3{margin:2px 4px 8px;font-size:16px}
.cl{padding:10px 4px;border-bottom:1px solid var(--bd)}
.cl .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.cl .nt{color:var(--mu);font-size:13px;font-style:italic;margin-top:2px;word-break:break-word}
.cl .ct{display:flex;align-items:center;gap:6px;margin-top:8px}
.cl .ct button{min-height:34px;min-width:34px;padding:0 10px;border-radius:10px}
.nb{display:block;width:100%;text-align:left;margin-top:6px;min-height:36px;padding:6px 12px;font-weight:500;font-size:13px;color:var(--ac);border-style:dashed;border-radius:10px;word-break:break-word}
.cl .q{min-width:24px;text-align:center;font-weight:700}
.sp{flex:1}
.tot{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:800;padding:14px 4px 10px}
.tot span:last-child{color:var(--ac)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.sc2{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}.sc2 .l{color:var(--mu);font-size:13px;font-weight:600}.sc2 .nn{font-size:36px;font-weight:800;color:var(--ac);margin-top:6px;line-height:1}.sc2 .s{color:var(--mu);font-size:12px;margin-top:6px}
.empty{color:var(--mu);text-align:center;padding:26px 8px}
.cbar{display:none}
.cx{display:none;align-items:center;min-height:32px;padding:0 12px;font-size:13px}
.v{max-width:1200px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.on{display:flex}
.md{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;width:100%;max-width:420px;max-height:88vh;max-height:88dvh;overflow-y:auto}
.md h2{margin:0 0 4px;font-size:18px}
.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1}
.seg{display:flex;gap:8px}.seg button{flex:1;color:var(--mu)}.seg button.on{background:var(--ac);border-color:var(--ac);color:#1a1a1a}
.kb{margin-top:10px;padding:12px;border-radius:12px;background:var(--bg);display:flex;justify-content:space-between;font-weight:700}
.kb .ok{color:var(--ok)}.kb .no{color:var(--dg)}
.ord{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--bd)}
.ord:last-child{border-bottom:0}
.ord .n{flex:1;min-width:0;font-weight:700}.ord .n small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.bd{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--card2);color:var(--mu);margin-left:6px}
.dl{padding:8px 0;border-bottom:1px solid var(--bd)}.dl:last-of-type{border-bottom:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ac);color:#1a1a1a;font-weight:700;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.toast.on{opacity:1}
@media(max-width:900px){
 .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s;width:250px}
 .side.on{transform:none}
 .sx{display:flex;width:36px;min-height:36px;padding:0;border:0;background:none;font-size:20px;color:var(--mu);margin:0 0 8px 6px;align-items:center;justify-content:center}
 .sc{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;display:none}.sc.on{display:block}
 .mh{display:flex}
 .pos{display:block}
 .cart{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:18px 18px 0 0;max-height:75vh;max-height:75dvh;overflow-y:auto;transform:translateY(110%);transition:transform .2s;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
 .cart.on{transform:none}
 .cbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ac);color:#1a1a1a;border-radius:16px;padding:0 16px;min-height:54px;align-items:center;justify-content:space-between;font-weight:800;border:0}
 .main{padding-bottom:90px}
 .cx{display:inline-flex}
}
@media(max-width:400px){.st{grid-template-columns:1fr}.main{padding-left:12px;padding-right:12px}.md{padding:14px}h1{font-size:22px}}
@media(max-height:480px) and (orientation:landscape){.ov{align-items:flex-start;overflow-y:auto}}
.lg{position:fixed;inset:0;z-index:200;background:var(--side);display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}.lg.on{display:flex}
.lgc{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px}.lgt{font-size:24px;font-weight:700}.lgs{color:var(--mu);margin:2px 0 6px}
</style>
</head>
<body>
<div class="lg on" id="login"><div class="lgc">
 <div class="lgt">Backup Mitra Kasir</div><div class="lgs">Masuk ke akun cabang</div>
 <label>Nama akun</label><input id="lgU" autocomplete="username" autocapitalize="none" autocorrect="off" placeholder="contoh: Surodinawan">
 <label>Password</label><input id="lgP" type="password" autocomplete="current-password" placeholder="Password">
 <div id="lgE" style="color:var(--dg);font-size:13px;min-height:18px;margin-top:8px"></div>
 <button class="p" id="lgB" style="width:100%;margin-top:6px">Masuk</button>
</div></div>
<div class="app">
 <aside class="side" id="side">
  <button class="sx" id="sx" aria-label="Tutup">✕</button>
  <div class="logo">Backup Mitra Kasir</div>
  <div class="gl">Platform</div>
  <button class="nv" data-v="dash"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Dashboard</button>
  <div class="gl">Transaksi</div>
  <button class="nv on" data-v="pos"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8a3 3 0 016 0"/></svg>POS</button>
  <div class="gl">Analitik &amp; Laporan</div>
  <button class="nv" data-v="jual"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 13l3-3 2 2 3-4"/><path d="M12 16v4M8 20h8"/></svg>Penjualan</button>
 <div class="sf"><i id="sfI">K</i><span id="sfN" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">Kasir</span><button id="lo" style="min-height:34px;padding:0 12px;font-size:13px">Keluar</button></div>
 </aside>
 <div class="sc" id="sc"></div>
 <main class="main">
  <div class="mh"><button id="burger">☰</button><b id="mt">POS</b></div>

  <section class="v on" id="v-pos">
   <h1>POS</h1>
   <div class="pos">
    <div>
     <div class="tabs" id="tabs"></div>
     <div class="card" id="list"></div>
    </div>
    <div class="card cart" id="cart">
     <h3 style="display:flex;justify-content:space-between;align-items:center">Pesanan<button class="cx" id="cx">Tutup</button></h3>
     <div id="cl"></div>
     <div class="tot"><span>Total</span><span id="tt">Rp 0</span></div>
     <button class="p" id="layani" style="width:100%" disabled>Layani</button>
    </div>
   </div>
  </section>

  <section class="v" id="v-dash">
   <h1>Dashboard</h1>
   <div id="dash"></div>
  </section>

  <section class="v" id="v-jual">
   <h1>Penjualan</h1>
   <div class="card" id="orders"></div>
  </section>
 </main>
</div>
<button class="cbar" id="cbar"><span id="cn">0 item</span><span id="ct">Rp 0</span></button>

<div class="ov" id="ovNote"><div class="md">
 <h2 id="nTitle">Catatan</h2>
 <label id="nLb">Catatan</label>
 <textarea id="nTx" rows="3" placeholder="Tulis catatan…"></textarea>
 <div id="nPw" style="display:none"><label>Harga (opsional)</label><input id="nPr" type="number" inputmode="numeric" placeholder="0"></div>
 <div class="row"><button id="nNo">Batal</button><button class="p" id="nOk">Simpan</button></div>
</div></div>

<div class="ov" id="ovPay"><div class="md">
 <h2>Layani Pesanan</h2>
 <div class="sub" style="color:var(--mu)">Total: <b class="pr" id="pTot"></b></div>
 <label>Nama pelanggan (opsional)</label>
 <input id="pName" placeholder="Nama pelanggan">
 <label>Pembayaran</label>
 <div class="seg"><button class="on" data-pay="Cash">Cash</button><button data-pay="QRIS">QRIS</button></div>
 <div id="cashBox">
  <label>Masukkan nominal (opsional)</label>
  <input id="pNom" type="text" inputmode="numeric" autocomplete="off" placeholder="Rp 0">
  <div class="seg" style="margin-top:8px"><button type="button" data-q="50000" style="color:var(--tx)">50k</button><button type="button" data-q="100000" style="color:var(--tx)">100k</button><button type="button" data-q="200000" style="color:var(--tx)">200k</button></div>
  <div class="kb"><span id="kLb">Kembalian</span><span id="kVal">Rp 0</span></div>
 </div>
 <div id="proofBox" style="display:none">
  <label>Bukti pembayaran QRIS (foto)</label>
  <div class="seg"><button type="button" id="pfCam" style="color:var(--tx)">Ambil foto</button><button type="button" id="pfPick" style="color:var(--tx)">Upload foto</button></div>
  <input type="file" id="pfFileC" accept="image/*" capture="environment" style="display:none">
  <input type="file" id="pfFileP" accept="image/*" style="display:none">
  <div id="pfPrev" style="margin-top:8px"></div>
 </div>
 <div class="row"><button id="pNo">Batal</button><button class="p" id="pOk">Selesai</button></div>
</div></div>

<div class="ov" id="ovDet"><div class="md">
 <h2 id="dName"></h2>
 <div id="dMeta" style="color:var(--mu);font-size:13px;margin-bottom:8px"></div>
 <div id="dItems"></div>
 <div id="dProof" style="margin-top:8px"></div>
 <div class="tot"><span>Total</span><span id="dTot"></span></div>
 <button style="width:100%" id="dClose">Tutup</button>
</div></div>

<div class="ov" id="ovDel"><div class="md">
 <h2>Hapus pesanan?</h2>
 <div id="delInfo" style="color:var(--mu);margin-top:6px"></div>
 <div class="kb" style="margin-top:12px"><span id="delMsg"></span></div>
 <label>Sandi hapus</label><input id="delPw" type="password" inputmode="numeric" autocomplete="off" placeholder="Masukkan sandi">
 <div id="delEr" style="color:var(--dg);font-size:13px;min-height:18px;margin-top:6px"></div>
 <div class="row"><button id="delNo">Batal</button><button id="delOk" style="color:var(--dg)">Hapus</button></div>
</div></div>

<div class="toast" id="toast"></div>
<div id="netPill" style="display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:70;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px #0006"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
/* login per cabang */
var FBCFG=window.FIREBASE_CONFIG||null,CABNAME='',fbP=null;
var ADM='';try{ADM=new URLSearchParams(location.search).get('admin')||''}catch(e){}
function KA(){if(ADM)return firebase.apps.length?firebase.app():firebase.initializeApp(FBCFG);return firebase.apps.filter(function(a){return a.name==='kasir'})[0]||firebase.initializeApp(FBCFG,'kasir')}
var _kf=null;function KF(){if(!_kf){_kf=KA().firestore();try{_kf.settings({experimentalForceLongPolling:true,merge:true})}catch(e){}}return _kf}
function fbInit(){if(!fbP){fbP=new Promise(function(res,rej){try{var un=KA().auth().onAuthStateChanged(function(u){un();res(u)},rej)}catch(e){rej(e)}}).catch(function(e){fbP=null;throw e})}return fbP}
function dayKey(){var n=new Date();return n.getFullYear()+'-'+(n.getMonth()+1)+'-'+n.getDate()}
var USER='';try{USER=localStorage.getItem('kc_session')||'';CABNAME=localStorage.getItem('kc_cab')||USER;if(localStorage.getItem('kc_day')!==dayKey()){USER='';localStorage.removeItem('kc_session')}}catch(e){}
if(ADM){USER=ADM;CABNAME=ADM}
if(!USER){
 var doLogin=function(){
  var u=$('lgU').value.trim(),p=$('lgP').value,b=$('lgB');
  if(!u||!p){$('lgE').textContent='Isi nama akun dan password.';return}
  if(!FBCFG||typeof firebase==='undefined'){$('lgE').textContent='Firebase belum siap. Periksa firebase-config.js dan koneksi internet.';return}
  b.disabled=true;$('lgE').textContent='';
  fbInit().then(function(){return KA().auth().signInWithEmailAndPassword(u.indexOf('@')>-1?u:u.toLowerCase()+'@'+(window.EMAIL_DOMAIN||'kasir.backupmitrakasir.com'),p)}).then(function(c){
   return KF().doc('kasir_akun/'+c.user.uid).get().then(function(sn){
    if(!sn.exists){return KA().auth().signOut().then(function(){b.disabled=false;$('lgE').textContent='Akun ini belum terdaftar sebagai cabang.'})}
    var d=sn.data();
    try{localStorage.setItem('kc_session',c.user.uid);localStorage.setItem('kc_cab',d.cab||u);localStorage.setItem('kc_day',dayKey())}catch(e){}
    location.reload()
   })
  }).catch(function(e){b.disabled=false;var c=e&&e.code;
   $('lgE').textContent=(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-email')?'Nama akun atau password salah. (kode: '+c+')':'Tidak bisa masuk. Periksa internet dan pengaturan Firebase. (kode: '+(c||(e&&e.message)||e)+')'})
 };

 $('lgB').onclick=doLogin;
 $('lgP').onkeydown=function(e){if(e.key==='Enter')doLogin()};
 $('lgU').onkeydown=function(e){if(e.key==='Enter')$('lgP').focus()};
 return
}
$('login').className='lg';
$('sfI').textContent=CABNAME.charAt(0).toUpperCase();$('sfN').textContent=CABNAME;
if(ADM){
 $('lo').textContent='\u2190 Admin';
 var pb=document.querySelector('.nv[data-v="pos"]');if(pb)pb.style.display='none';
 var bn=document.createElement('div');bn.id='admBn';bn.style.cssText='background:#f5c518;color:#1a1a1a;font-weight:700;padding:10px 14px;border-radius:12px;margin-bottom:12px';bn.textContent='MODE ADMIN \u00b7 melihat akun cabang';
 var mn=document.querySelector('.main');if(mn)mn.insertBefore(bn,mn.firstChild)
}
$('lo').onclick=function(){if(ADM){location.href='admin-mitra-kasir.html';return}try{localStorage.removeItem('kc_session')}catch(e){}var g=function(){location.reload()};try{KA().auth().signOut().then(g,g)}catch(e){g()}};
/* logout otomatis tengah malam (00:00) */
function chkDay(){if(ADM)return;try{if(localStorage.getItem('kc_day')!==dayKey()){localStorage.removeItem('kc_session');try{KA().auth().signOut()}catch(x){}setTimeout(function(){location.reload()},500)}}catch(e){}}
setInterval(chkDay,15000);document.addEventListener('visibilitychange',chkDay);
var nx=new Date();nx.setHours(24,0,0,0);setTimeout(chkDay,nx-new Date()+500);
var MENU={
 original:{label:'Original',price:5000,items:['Sweet','Brown Sugar','Cinnamon']},
 filling:{label:'Filling',price:7000,items:['Coco Maltin','Cheese','Greentea','Tiramisu','Strawberry','Blueberry','Maple','Nutella']},
 mini:{label:'Mini Croffle',price:15000,note:true,items:['Mini Croffle Mix','Mini Croffle Req']},
 extra:{label:'Extra Topping',price:5000,note:true,extra:true,items:['Extra Topping']}
};
var cat='original',cart=[],pay='Cash',editIdx=-1,pend=null,OK='kc_orders_v1_'+USER;
function rp(n){return 'Rp '+Math.round(n).toLocaleString('id-ID')}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var e=$('toast');e.textContent=t;e.className='toast on';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className='toast'},1600)}
function getO(){if(ADM)return[];try{return JSON.parse(localStorage.getItem(OK)||'[]')||[]}catch(e){return[]}}
function setO(o){if(ADM)return;try{localStorage.setItem(OK,JSON.stringify(o))}catch(e){}}
var mem=null;
function orders(){if(mem===null)mem=getO();return mem}
function total(){return cart.reduce(function(s,l){return s+l.price*l.qty},0)}

/* navigasi */
function show(v){
 document.querySelectorAll('.v').forEach(function(e){e.classList.toggle('on',e.id==='v-'+v)});
 document.querySelectorAll('.nv').forEach(function(e){e.classList.toggle('on',e.dataset.v===v)});
 curView=v;$('mt').textContent={pos:'POS',jual:'Penjualan',dash:'Dashboard'}[v];
 $('cbar').style.display=v==='pos'&&window.innerWidth<=900?'flex':'none';
 closeSide();if(v==='jual')renderOrders();if(v==='dash')renderDash();saveState()
}
function closeSide(){$('side').classList.remove('on');$('sc').classList.remove('on')}
document.querySelectorAll('.nv').forEach(function(b){b.onclick=function(){show(b.dataset.v)}});
$('burger').onclick=function(){$('side').classList.add('on');$('sc').classList.add('on')};
$('sc').onclick=closeSide;$('sx').onclick=closeSide;
window.addEventListener('resize',function(){var on=$('v-pos').classList.contains('on');$('cbar').style.display=on&&window.innerWidth<=900?'flex':'none'});
$('cbar').onclick=function(){$('cart').classList.toggle('on')};
$('cx').onclick=function(){$('cart').classList.remove('on')};

/* menu */
function renderTabs(){
 $('tabs').innerHTML=Object.keys(MENU).map(function(k){return '<button class="tab'+(k===cat?' on':'')+'" data-c="'+k+'">'+MENU[k].label+'</button>'}).join('');
}
function renderList(){
 var m=MENU[cat];
 $('list').innerHTML=m.items.map(function(n,i){
  var sub=m.note?'<small>Dengan catatan</small>':'';
  var price='<span class="pr">'+rp(m.price)+'</span>';
  return '<div class="it"><div class="n">'+esc(n)+sub+'</div>'+price+'<button class="add" data-i="'+i+'" aria-label="Tambah">+</button></div>'
 }).join('');
}
$('tabs').onclick=function(e){var b=e.target.closest('.tab');if(!b)return;cat=b.dataset.c;renderTabs();renderList();saveState()};
$('list').onclick=function(e){
 var b=e.target.closest('.add');if(!b)return;
 var m=MENU[cat],name=m.items[+b.dataset.i];
 if(m.note){openNote({name:name,price:m.price,extra:!!m.extra},-1);return}
 var f=cart.filter(function(l){return !l.note_t&&l.name===name})[0];
 if(f)f.qty++;else cart.push({name:name,price:m.price,qty:1,note_t:false,note:''});
 renderCart()
};

/* catatan */
function openNote(info,idx){
 pend=info;editIdx=idx;
 var l=idx>=0?cart[idx]:null;
 $('nTitle').textContent=info.name;
 $('nLb').textContent=info.extra?'Catatan topping':'Catatan isi (diisi apa)';
 $('nTx').value=l?l.note:'';
 $('nPw').style.display='none';
 $('nPr').value=l&&info.extra&&l.price?l.price:'';
 $('ovNote').className='ov on';
 setTimeout(function(){$('nTx').focus()},50)
}
$('nNo').onclick=function(){$('ovNote').className='ov'};
$('nOk').onclick=function(){
 var note=$('nTx').value.trim(),price=pend.price;
 if(editIdx>=0){cart[editIdx].note=note;cart[editIdx].price=price}
 else cart.push({name:pend.name,price:price,qty:1,note_t:true,note:note});
 $('ovNote').className='ov';renderCart();toast('Catatan disimpan')
};

/* keranjang */
function renderCart(){
 var h=cart.map(function(l,i){
  return '<div class="cl"><div class="t"><span>'+esc(l.name)+'</span><span class="pr">'+rp(l.price*l.qty)+'</span></div>'+
  (l.note_t?'<button class="nb" data-a="e" data-i="'+i+'">'+(l.note?'Catatan: '+esc(l.note):'+ Tambah catatan')+'</button>':'')+
  '<div class="ct"><button data-a="m" data-i="'+i+'">−</button><span class="q">'+l.qty+'</span><button data-a="p" data-i="'+i+'">+</button>'+
  ''+
  '<span class="sp"></span><button data-a="d" data-i="'+i+'" style="color:var(--dg)">Hapus</button></div></div>'
 }).join('');
 $('cl').innerHTML=h||'<div class="empty">Belum ada pesanan.<br>Tekan + pada menu.</div>';
 var t=total(),n=cart.reduce(function(s,l){return s+l.qty},0);
 $('tt').textContent=rp(t);$('ct').textContent=rp(t);$('cn').textContent=n+' item · Keranjang';
 $('layani').disabled=!cart.length;saveState()
}
$('cl').onclick=function(e){
 var b=e.target.closest('button');if(!b)return;
 var i=+b.dataset.i,a=b.dataset.a,l=cart[i];if(!l)return;
 if(a==='p')l.qty++;
 else if(a==='m'){l.qty--;if(l.qty<1)cart.splice(i,1)}
 else if(a==='d')cart.splice(i,1);
 else if(a==='e'){openNote({name:l.name,extra:l.name==='Extra Topping',price:l.price},i);return}
 renderCart()
};

/* bayar */
function calc(){
 var t=total(),v=parseFloat(($('pNom').value||'').replace(/\D/g,''));
 var lb=$('kLb'),vl=$('kVal');
 if(!v){lb.textContent='Kembalian';vl.textContent='Rp 0';vl.className='';return}
 if(v>=t){lb.textContent='Kembalian';vl.textContent=rp(v-t);vl.className='ok'}
 else{lb.textContent='Kurang';vl.textContent=rp(t-v);vl.className='no'}
}
$('layani').onclick=function(){
 $('cart').classList.remove('on');
 $('pTot').textContent=rp(total());$('pName').value='';$('pNom').value='';pay='Cash';
 document.querySelectorAll('[data-pay]').forEach(function(b){b.classList.toggle('on',b.dataset.pay==='Cash')});
 $('cashBox').style.display='block';$('proofBox').style.display='none';proofImg='';renderProof();calc();$('ovPay').className='ov on';saveState()
};
document.querySelectorAll('[data-pay]').forEach(function(b){b.onclick=function(){
 pay=b.dataset.pay;
 document.querySelectorAll('[data-pay]').forEach(function(x){x.classList.toggle('on',x===b)});
 $('cashBox').style.display=pay==='Cash'?'block':'none';$('proofBox').style.display=pay==='QRIS'?'block':'none';saveState()
}});
$('pNom').oninput=function(){var d=this.value.replace(/\D/g,'');this.value=d?'Rp '+Number(d).toLocaleString('id-ID'):'';calc();saveState()};
document.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){$('pNom').value='Rp '+Number(b.dataset.q).toLocaleString('id-ID');calc();saveState()}});
$('pNo').onclick=function(){$('ovPay').className='ov';saveState()};
/* bukti pembayaran QRIS */
var proofImg='',PP={},curDet=null;
try{PP=JSON.parse(localStorage.getItem('kc_pp_'+USER)||'{}')||{}}catch(e){PP={}}
if(ADM)PP={};
function savePP(){if(ADM)return;try{localStorage.setItem('kc_pp_'+USER,JSON.stringify(PP))}catch(e){}}
function shrink(file,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var w=im.width,h=im.height,k=Math.min(1,900/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.6))};im.onerror=function(){cb('')};im.src=fr.result};fr.onerror=function(){cb('')};fr.readAsDataURL(file)}
function renderProof(){
 $('pfPrev').innerHTML=proofImg?'<img src="'+proofImg+'" style="width:100%;max-height:260px;object-fit:contain;border-radius:12px;border:1px solid var(--bd)"><button type="button" id="pfDel" style="width:100%;margin-top:6px;color:var(--dg)">Hapus foto</button>':'<div style="color:var(--mu);font-size:13px">Belum ada foto (opsional).</div>';
 var d=$('pfDel');if(d)d.onclick=function(){proofImg='';renderProof()}
}
function onPf(e){var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;shrink(f,function(u){if(!u){toast('Foto gagal dibaca');return}proofImg=u;renderProof()})}
$('pfFileC').onchange=onPf;$('pfFileP').onchange=onPf;
$('pfCam').onclick=function(){$('pfFileC').click()};
$('pfPick').onclick=function(){$('pfFileP').click()};
renderProof();
function pushProof(id){var img=PP[id];if(!fdb||!img)return;fdb.doc('kasir_bukti/'+USER+'_'+id).set({cab:USER,id:id,img:img}).then(function(){delete PP[id];savePP()}).catch(function(){})}
function showProof(r){
 var el=$('dProof');el.innerHTML='';curDet=r.id;if(!r.proof)return;
 var id=r.id,note=function(t){if(String(curDet)===String(id))el.innerHTML='<div style="color:var(--mu);font-size:13px">'+t+'</div>'};
 var paint=function(u){if(String(curDet)===String(id))el.innerHTML='<label>Bukti pembayaran</label><img src="'+u+'" style="width:100%;border-radius:12px;border:1px solid var(--bd)">'};
 if(PP[id]){paint(PP[id]);return}
 if(!fdb){note('Bukti belum bisa dimuat (belum tersambung).');return}
 note('Memuat bukti pembayaran...');
 fdb.doc('kasir_bukti/'+(r.cab||USER)+'_'+id).get().then(function(sn){if(sn.exists&&sn.data().img)paint(sn.data().img);else note('Bukti belum terunggah atau tidak ditemukan.')}).catch(function(){note('Gagal memuat bukti pembayaran.')})
}
$('pOk').onclick=function(){
 var o=orders();
 o.unshift({id:Date.now(),name:$('pName').value.trim(),time:new Date().toISOString(),total:total(),pay:pay,proof:(pay==='QRIS'&&proofImg)?1:0,
  items:cart.map(function(l){return{name:l.name,price:l.price,qty:l.qty,note:l.note}})});
 setO(o);var nr=o[0];pnd.push(nr.id);savePnd();pushOrder(nr);if(nr.proof){PP[nr.id]=proofImg;savePP();pushProof(nr.id)}proofImg='';$('ovPay').className='ov';cart=[];renderCart();toast('Pesanan dilayani')
};

/* penjualan */
function tm(iso){var d=new Date(iso);return d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace('.',':')}
function dt(iso){return new Date(iso).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
function renderOrders(){
 var o=orders();
 $('orders').innerHTML=(ADM&&o.length?'<button data-all="1" style="width:100%;margin-bottom:10px;color:var(--dg)">Hapus semua penjualan akun ini</button>':'')+o.map(function(r){
  return '<div class="ord"><div class="n">'+esc(r.name||'Tanpa nama')+'<span class="bd">'+esc(r.pay)+'</span>'+(r.proof?'<span class="bd">Bukti</span>':'')+'<small>'+dt(r.time)+' · '+tm(r.time)+'</small></div><span class="pr">'+rp(r.total)+'</span><button data-id="'+r.id+'" style="padding:0 12px">Lihat</button>'+(ADM?'<button data-d="'+r.id+'" style="padding:0 12px;color:var(--dg)">Hapus</button>':'')+'</div>'
 }).join('')||'<div class="empty">Belum ada penjualan.</div>'
}
$('orders').onclick=function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.all){if(!confirm('Hapus SEMUA penjualan akun ini? Tidak bisa dikembalikan.'))return;
  var bt=fdb.batch();orders().slice(0,240).forEach(function(r){bt.delete(fdb.doc('kasir_orders/'+USER+'_'+r.id));if(r.proof)bt.delete(fdb.doc('kasir_bukti/'+USER+'_'+r.id))});bt.commit().then(function(){toast('Semua penjualan dihapus')}).catch(function(){toast('Gagal menghapus')});return}
 if(b.dataset.d){if(ADM)askDel(b.dataset.d);return}
 var r=orders().filter(function(x){return String(x.id)===b.dataset.id})[0];if(!r)return;
 $('dName').textContent=r.name||'Tanpa nama';
 $('dMeta').textContent=dt(r.time)+' · '+tm(r.time)+' · '+r.pay;
 $('dItems').innerHTML=r.items.map(function(l){
  return '<div class="dl"><div style="display:flex;justify-content:space-between;gap:8px"><span>'+l.qty+'× '+esc(l.name)+'</span><span class="pr">'+rp(l.price*l.qty)+'</span></div>'+(l.note?'<div class="nt" style="color:var(--mu);font-size:13px;font-style:italic">Catatan: '+esc(l.note)+'</div>':'')+'</div>'
 }).join('');
 $('dTot').textContent=rp(r.total);$('ovDet').className='ov on';showProof(r)
};
$('dClose').onclick=function(){curDet=null;$('ovDet').className='ov'};

/* sinkron Firebase (hanya jalan di versi file / hosting; di halaman preview otomatis nonaktif) */
/* konfigurasi Firebase dibaca dari firebase-config.js */
var fdb=null,pnd=[],PK='kc_pnd_'+USER;
try{pnd=JSON.parse(localStorage.getItem(PK)||'[]')||[]}catch(e){pnd=[]}
if(ADM)pnd=[];
function savePnd(){if(ADM)return;try{localStorage.setItem(PK,JSON.stringify(pnd))}catch(e){}}
function adOf(r){var a=0;(r.items||[]).forEach(function(l){var c=catOf(l.name);if(c)a+=l.qty*AD[c]});return a}
function pushOrder(r){
 if(!fdb)return;
 var d=JSON.parse(JSON.stringify(r));d.cab=USER;d.cn=CABNAME;d.t=new Date(r.time).getTime();d.ad=adOf(r);
 fdb.doc('kasir_orders/'+USER+'_'+r.id).set(d).then(function(){pnd=pnd.filter(function(x){return x!==r.id});savePnd()}).catch(function(){})
}
function admSync(){
 var ms=function(t){document.body.innerHTML='<div style="max-width:420px;margin:60px auto;padding:20px;text-align:center;font-family:sans-serif;color:#eee"><p>'+t+'</p><a href="admin-mitra-kasir.html" style="color:#f5c518">Buka halaman admin</a></div>'};
 if(!FBCFG||typeof firebase==='undefined'){ms('Firebase belum siap. Periksa firebase-config.js dan internet.');return}
 fbInit().then(function(u){
  if(!u||!u.email||u.email.toLowerCase()!==String(window.ADMIN_EMAIL||'').toLowerCase()){ms('Halaman ini hanya untuk admin. Silakan login dulu di halaman admin, lalu klik Lihat lagi.');return}
  fdb=KF();
  fdb.doc('kasir_akun/'+ADM).get().then(function(d){if(d.exists){var x=d.data();CABNAME=x.cab||x.nama||ADM;$('sfN').textContent=CABNAME;$('sfI').textContent=CABNAME.charAt(0).toUpperCase();var b=$('admBn');if(b)b.textContent='MODE ADMIN \u00b7 '+CABNAME}}).catch(function(){});
  fdb.collection('kasir_orders').where('cab','==',ADM).onSnapshot(function(q){
   var srv=[];q.forEach(function(d){srv.push(d.data())});srv.sort(function(a,b){return b.id-a.id});
   mem=srv;if(curView==='jual')renderOrders();if(curView==='dash')renderDash()
  },function(e){toast('Gagal memuat: '+(e&&e.code||e))})
 }).catch(function(e){ms('Gagal memuat: '+(e&&e.code||e))})
}
function startSync(){
 if(ADM){admSync();return}
 try{
  if(!FBCFG||typeof firebase==='undefined')return;
  fbInit().then(function(u){
   if(!u||u.uid!==USER){try{localStorage.removeItem('kc_session')}catch(e){}location.reload();return}
   fdb=KF();Object.keys(PP).forEach(function(k){pushProof(k)});
   fdb.doc('kasir_akun/'+USER).get().then(function(s){if(!s.exists){try{localStorage.removeItem('kc_session')}catch(e){}location.reload()}}).catch(function(){});var FK='kc_sy_'+USER;
   if(!localStorage.getItem(FK)){orders().forEach(function(r){if(pnd.indexOf(r.id)<0)pnd.push(r.id)});savePnd();localStorage.setItem(FK,'1')}
   orders().forEach(function(r){if(pnd.indexOf(r.id)>-1)pushOrder(r)});
   fdb.collection('kasir_orders').where('cab','==',USER).onSnapshot(function(s){
    var srv=[],ids={};s.forEach(function(d){var x=d.data();srv.push(x);ids[x.id]=1});
    var loc=orders().filter(function(r){return pnd.indexOf(r.id)>-1&&!ids[r.id]});
    var all=srv.concat(loc).sort(function(a,b){return b.id-a.id});
    mem=all;setO(all);
    if(curView==='jual')renderOrders();if(curView==='dash')renderDash()
   },function(){})
  }).catch(function(){})
 }catch(e){}
}

/* status offline / antrean kirim */
function updNet(){
 var p=$('netPill'),n=pnd.length,off=!navigator.onLine;
 if(ADM){p.style.display='none';return}
 p.style.display='block';p.style.background=off?'#ef4444':'#22c55e';
 p.title=(off?'Offline':'Online')+(n?' \u00b7 '+n+' pesanan menunggu kirim':'')
}
window.addEventListener('online',updNet);window.addEventListener('offline',updNet);setInterval(updNet,3000);updNet();
try{if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}catch(e){}

/* simpan keadaan supaya refresh tidak membatalkan pesanan */
var curView='pos',SK='kc_state_v1_'+USER;
function saveState(){
 if(ADM)return;
 try{localStorage.setItem(SK,JSON.stringify({cart:cart,cat:cat,view:curView,payOpen:$('ovPay').classList.contains('on'),name:$('pName').value,pay:pay,nom:$('pNom').value}))}catch(e){}
}

/* hapus pesanan (dengan konfirmasi) */
var DELPW='111'; /* SANDI HAPUS: ubah angka ini kalau ingin ganti sandi */
var delT=null,delId=null;
function askDel(id){
 if(!ADM)return;
 var r=orders().filter(function(x){return String(x.id)===id})[0];if(!r)return;
 delId=id;var ok=$('delOk');
 $('delInfo').textContent=(r.name||'Tanpa nama')+' · '+rp(r.total)+' · '+tm(r.time);
 $('delPw').value='';$('delEr').textContent='';ok.disabled=false;ok.textContent='Hapus';$('delMsg').textContent='Pesanan yang dihapus tidak bisa dikembalikan.';
 $('ovDel').className='ov on';clearInterval(delT);setTimeout(function(){$('delPw').focus()},50);
 }
function closeDel(){clearInterval(delT);$('ovDel').className='ov'}
$('delNo').onclick=closeDel;
$('delPw').style.display='none';if($('delPw').previousElementSibling)$('delPw').previousElementSibling.style.display='none';
$('delPw').onkeydown=function(e){if(e.key==='Enter')$('delOk').click()};
$('delOk').onclick=function(){if(!ADM)return;var o=orders().filter(function(x){return String(x.id)!==delId});mem=o;setO(o);if(fdb){fdb.doc('kasir_orders/'+USER+'_'+delId).delete().catch(function(){});fdb.doc('kasir_bukti/'+USER+'_'+delId).delete().catch(function(){})}delete PP[delId];savePP();pnd=pnd.filter(function(x){return String(x)!==String(delId)});savePnd();closeDel();renderOrders();toast('Pesanan dihapus')};

/* dashboard: adonan */
var AD={'Original':1,'Filling':1,'Mini Croffle':2,'Extra Topping':0};
function catOf(n){for(var k in MENU){if(MENU[k].items.indexOf(n)>-1)return MENU[k].label}return ''}
function renderDash(){
 var o=orders(),td=new Date().toDateString(),ad=0,cash=0,qris=0;
 o.forEach(function(r){
  if(new Date(r.time).toDateString()!==td)return;
  r.items.forEach(function(l){var c=catOf(l.name);if(c)ad+=l.qty*AD[c]});
  if(r.pay==='QRIS')qris+=r.total;else cash+=r.total
 });
 $('dash').innerHTML='<div class="sc2" style="margin-bottom:12px"><div class="l">Adonan hari ini</div><div class="nn">'+ad+'</div><div class="s">pcs adonan</div></div>'+
  '<div class="st"><div class="sc2"><div class="l">Penjualan tunai</div><div class="nn" style="font-size:24px">'+rp(cash)+'</div><div class="s">hari ini</div></div><div class="sc2"><div class="l">Penjualan QRIS</div><div class="nn" style="font-size:24px">'+rp(qris)+'</div><div class="s">hari ini</div></div></div>'
}
function renderDashOld(){
 var o=orders(),td=new Date().toDateString(),all=0,tod=0,by={},days={};
 Object.keys(AD).forEach(function(k){by[k]={q:0,a:0}});
 o.forEach(function(r){
  var ad=0;
  r.items.forEach(function(l){var c=catOf(l.name);if(!c)return;var a=l.qty*AD[c];by[c].q+=l.qty;by[c].a+=a;ad+=a});
  all+=ad;if(new Date(r.time).toDateString()===td)tod+=ad;
  var dk=dt(r.time);days[dk]=(days[dk]||0)+ad
 });
 var rows=Object.keys(AD).map(function(k){
  var sub=AD[k]?by[k].q+' porsi × '+AD[k]+' adonan':by[k].q+' porsi · topping, tidak dihitung adonan';
  return '<div class="ord"><div class="n">'+k+'<small>'+sub+'</small></div><span class="pr">'+(AD[k]?by[k].a+' adonan':'–')+'</span></div>'
 }).join('');
 var dr=Object.keys(days).map(function(d){return '<div class="ord"><div class="n">'+d+'</div><span class="pr">'+days[d]+' adonan</span></div>'}).join('')||'<div class="empty">Belum ada transaksi.</div>';
 $('dash').innerHTML='<div class="st"><div class="sc2"><div class="l">Adonan hari ini</div><div class="nn">'+tod+'</div><div class="s">pcs adonan</div></div><div class="sc2"><div class="l">Semua transaksi</div><div class="nn">'+all+'</div><div class="s">pcs adonan · '+o.length+' transaksi</div></div></div>'+
  '<div class="card"><h3 style="margin:2px 4px 6px;font-size:16px">Rincian adonan</h3>'+rows+'</div>'+
  '<div class="card" style="margin-top:14px"><h3 style="margin:2px 4px 6px;font-size:16px">Adonan per hari</h3>'+dr+'</div>'
}

var st=null;try{if(!ADM)st=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){st=null}
try{if(st){
 if(Array.isArray(st.cart))cart=st.cart.filter(function(l){return l&&typeof l.name==='string'&&l.price>=0&&l.qty>0}).map(function(l){return{name:l.name,price:+l.price,qty:+l.qty,note_t:!!l.note_t,note:String(l.note||'')}});
 if(MENU[st.cat])cat=st.cat
}}catch(e){cart=[]}
$('pName').oninput=saveState;
renderTabs();renderList();renderCart();show(ADM?'jual':(st&&{pos:1,jual:1,dash:1}[st.view]?st.view:'pos'));
try{if(st&&st.payOpen&&cart.length){
 $('pTot').textContent=rp(total());$('pName').value=st.name||'';pay=st.pay==='QRIS'?'QRIS':'Cash';
 document.querySelectorAll('[data-pay]').forEach(function(b){b.classList.toggle('on',b.dataset.pay===pay)});
 $('cashBox').style.display=pay==='Cash'?'block':'none';$('proofBox').style.display=pay==='QRIS'?'block':'none';$('pNom').value=st.nom||'';calc();$('ovPay').className='ov on'
}}catch(e){}
saveState();startSync();
})();
</script>
